<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — STEA VPN</title>
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" href="/favicon.ico" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      text-align: center;
      max-width: 420px;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      border-radius: 14px;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    p {
      color: #a1a1aa;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.875rem 1.5rem;
      border-radius: 8px;
      background: linear-gradient(135deg, #f59e0b, #e88a1e);
      color: #0a0a0a;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.35);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="STEA VPN" class="logo" />
    <h1>You're offline</h1>
    <p>Some pages may not be available. Reconnect to continue.</p>
    <a href="/" class="btn">Go back home</a>
  </div>
</body>
</html>
